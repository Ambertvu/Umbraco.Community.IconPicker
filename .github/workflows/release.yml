name: Publish NuGet Package

# Starts when a correctly formatted tag is pushed (e.g. 18.1.4).
# The first number of the tag is the Umbraco major the package is built against.

env:
  OUTPUT: ./nupkgs

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Needed for NuGet Trusted Publishing
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Get the Umbraco major from the tag
      run: echo "UMBRACO_MAJOR=${GITHUB_REF_NAME%%.*}" >> "$GITHUB_ENV"

    - name: Build and pack
      run: |
        dotnet pack src/Umbraco.Community.IconPicker/Umbraco.Community.IconPicker.csproj \
          -c Release -p:UmbracoMajor=$UMBRACO_MAJOR -p:Version=${{ github.ref_name }} -o ${{ env.OUTPUT }}
        dotnet pack src/Umbraco.Community.IconPicker.Assets/Umbraco.Community.IconPicker.Assets.csproj \
          -c Release -p:UmbracoMajor=$UMBRACO_MAJOR -p:Version=${{ github.ref_name }} -o ${{ env.OUTPUT }}

    - name: NuGet login
      uses: NuGet/login@v1
      id: login
      with:
        user: Ambertvu

    - name: Publish to NuGet
      run: dotnet nuget push "nupkgs/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
